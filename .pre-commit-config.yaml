repos:
  - repo: local
    hooks:
      - id: black
        name: black formatting
        entry: python -m black --check
        language: system
        types: [python]
      - id: flake8
        name: flake8 style
        entry: python -m flake8
        language: system
        types: [python]
      - id: pytest
        name: pytest regression
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
      - id: pylint
        name: pylint score at least 9
        entry: python -m pylint src/plantops --fail-under=9.0
        language: system
        pass_filenames: false
        types: [python]
